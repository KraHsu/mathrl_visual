name: Deploy MathRL Visual to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Set up pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component clippy,rustfmt
          --target wasm32-unknown-unknown

      - name: Install pinned WebAssembly tools
        run: |
          cargo install wasm-pack --version 0.15.0 --locked
          cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Install Playwright browser
        run: corepack pnpm --filter @mathrl/site exec playwright install --with-deps chrome

      - name: Run repository checks
        env:
          PAGES_TEST_BASE: ${{ steps.pages.outputs.base_path }}/
        run: corepack pnpm check

      - name: Build GitHub Pages artifact
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          VITE_SITE_STAGE: preview
        run: corepack pnpm build

      - name: Verify GitHub Pages artifact
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_STAGE: preview
        run: node scripts/check-pages-artifact.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
