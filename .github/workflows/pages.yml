name: Build and deploy MathRL Visual to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Normalize Pages base path
        id: site_base
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          base="${PAGES_BASE_PATH:-/}"
          [[ "$base" == /* ]] || base="/$base"
          [[ "$base" == */ ]] || base="$base/"
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          echo "Using Pages base: $base"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Set up pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component clippy,rustfmt
          --target wasm32-unknown-unknown

      - name: Restore pinned WebAssembly tools
        id: wasm-tools-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: ${{ runner.os }}-${{ runner.arch }}-wasm-pack-0.15.0-wasm-bindgen-0.2.127

      - name: Install pinned WebAssembly tools
        if: steps.wasm-tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install wasm-pack --version 0.15.0 --locked
          cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Verify WebAssembly tools
        run: |
          wasm-pack --version
          wasm-bindgen --version

      - name: Install Playwright browsers
        # The Playwright config uses its pinned browser binaries (not a
        # machine-wide Chrome channel), so the CI check and local reproduction
        # exercise the same engine.  The preview job runs Chromium by default;
        # Firefox/WebKit are installed here so the same runner image can run
        # the cross-browser/release gates without changing the dependency set.
        run: corepack pnpm --filter @mathrl/site exec playwright install --with-deps chromium firefox webkit

      - name: Run repository checks
        env:
          PAGES_TEST_BASE: ${{ steps.site_base.outputs.base }}
        run: corepack pnpm check

      - name: Build GitHub Pages artifact
        env:
          SITE_BASE: ${{ steps.site_base.outputs.base }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          VITE_SITE_STAGE: preview
        run: corepack pnpm build

      - name: Verify GitHub Pages artifact
        env:
          PAGES_BASE: ${{ steps.site_base.outputs.base }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_STAGE: preview
        run: node scripts/check-pages-artifact.mjs

      - name: Verify SBOM and license inventory
        env:
          PAGES_BASE: ${{ steps.site_base.outputs.base }}
        run: |
          node scripts/check-sbom.mjs
          node scripts/check-pwa-artifact.mjs
          PERF_DIST=site/docs/.vitepress/dist node scripts/check-performance-budget.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/docs/.vitepress/dist

  deploy:
    name: Deploy
    # This is the ordinary static-site path: every successful main push
    # publishes the preview site.  The separate release workflow remains an
    # optional, stricter path for teams that want a formally reviewed release.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Checkout smoke script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node.js for deployment smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Run preview deployment smoke
        env:
          SMOKE_URL: ${{ steps.deployment.outputs.page_url }}
          SMOKE_REPORT: release-evidence/deployment-smoke.json
          EXPECTED_GIT_SHA: ${{ github.sha }}
          EXPECTED_STAGE: preview
          SMOKE_RETRIES: '2'
          SMOKE_TIMEOUT_MS: '20000'
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          for attempt in 1 2 3 4 5 6; do
            if node scripts/smoke-deployed.mjs; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep "$((attempt * 10))"
            fi
          done
          echo "::error::preview deployment smoke did not pass after Pages propagation retries"
          exit 1

      - name: Upload preview smoke evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: mathrl-preview-smoke-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: release-evidence/deployment-smoke.json
