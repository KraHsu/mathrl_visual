name: MathRL Visual production release

# Production is deliberately manual and fail-closed.  Configure required
# reviewers on the `production` environment before enabling this workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full 40-character commit SHA to release (the dispatch ref must resolve to this SHA)
        required: true
        type: string
      app_version:
        description: SemVer version written to version.json
        required: true
        default: 1.0.0
        type: string
      site_base:
        description: Pages mount path (leave / for a custom domain)
        required: true
        default: /mathrl_visual/
        type: string
      wasm_chromedriver_version:
        description: Exact four-part Chrome for Testing version for the pinned Playwright Chromium
        required: true
        type: string
      wasm_chromedriver_sha256:
        description: SHA-256 of the Chrome for Testing chromedriver executable for this runner
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mathrl-production-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify production artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    environment:
      name: production

    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validate release inputs
        env:
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_APP_VERSION: ${{ inputs.app_version }}
          RELEASE_SITE_BASE: ${{ inputs.site_base }}
          RELEASE_WASM_DRIVER_VERSION: ${{ inputs.wasm_chromedriver_version }}
          RELEASE_WASM_DRIVER_SHA256: ${{ inputs.wasm_chromedriver_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be a full 40-character commit SHA; mutable branches and tags are not accepted"
            exit 1
          fi
          if [[ "$RELEASE_EVENT_SHA" != "$RELEASE_REF" ]]; then
            echo "::error::workflow dispatch ref ($RELEASE_EVENT_SHA) must equal the requested release SHA ($RELEASE_REF)"
            echo "::error::Start from a tag or branch whose resolved commit is exactly the requested SHA."
            exit 1
          fi
          checked_out="$(git rev-parse HEAD)"
          if [[ "$checked_out" != "$RELEASE_REF" ]]; then
            echo "::error::checkout resolved to $checked_out, not the requested immutable SHA"
            exit 1
          fi
          if [[ ! "$RELEASE_APP_VERSION" =~ ^1\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::app_version must be a SemVer 1.x release (for example 1.0.0)"
            exit 1
          fi
          if [[ ! "$RELEASE_SITE_BASE" =~ ^/([A-Za-z0-9._~-]+/)*$ ]]; then
            echo "::error::site_base must be a slash-delimited path such as /mathrl_visual/ or /"
            exit 1
          fi
          if [[ "$RELEASE_SITE_BASE" =~ (^|/)\.\.?(/|$) ]]; then
            echo "::error::site_base must not contain . or .. path segments"
            exit 1
          fi
          if [[ ! "$RELEASE_WASM_DRIVER_VERSION" =~ ^[0-9]{1,10}(\.[0-9]{1,10}){3}$ ]]; then
            echo "::error::wasm_chromedriver_version must be a four-part numeric Chrome for Testing version"
            exit 1
          fi
          if [[ ! "$RELEASE_WASM_DRIVER_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::wasm_chromedriver_sha256 must be a 64-character hexadecimal digest"
            exit 1
          fi

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Set up pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component clippy,rustfmt
          --target wasm32-unknown-unknown

      - name: Restore pinned cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-audit-0.22.2

      - name: Install pinned cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Restore pinned WebAssembly tools
        id: wasm-tools-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: ${{ runner.os }}-${{ runner.arch }}-wasm-pack-0.15.0-wasm-bindgen-0.2.127

      - name: Install pinned WebAssembly tools
        if: steps.wasm-tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install wasm-pack --version 0.15.0 --locked
          cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Install Playwright browsers
        run: corepack pnpm --filter @mathrl/site exec playwright install --with-deps chromium firefox webkit

      - name: Resolve pinned Chromium binary for Wasm
        env:
          EXPECTED_WASM_CHROME_VERSION: ${{ inputs.wasm_chromedriver_version }}
        run: |
          set -euo pipefail
          browser_root="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
          mapfile -t browsers < <(find "$browser_root" -type f \( -path '*/chrome-linux/chrome' -o -path '*/chrome-linux64/chrome' \) -perm -111 -print | sort)
          selected=''
          actual=''
          for candidate in "${browsers[@]}"; do
            candidate_version="$("$candidate" --version 2>/dev/null | sed -nE 's/.*([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"
            if [[ "$candidate_version" == "$EXPECTED_WASM_CHROME_VERSION" ]]; then
              if [[ -n "$selected" ]]; then
                echo "::error::multiple Playwright Chromium binaries match $EXPECTED_WASM_CHROME_VERSION"
                printf '%s\n' "$selected" "$candidate"
                exit 1
              fi
              selected="$candidate"
              actual="$candidate_version"
            fi
          done
          if [[ -z "$selected" ]]; then
            echo "::error::no Playwright Chromium binary matches $EXPECTED_WASM_CHROME_VERSION under $browser_root"
            printf '%s\n' "${browsers[@]}"
            exit 1
          fi
          echo "CHROME_BIN=$selected" >> "$GITHUB_ENV"
          echo "Pinned Wasm Chromium: $selected ($actual)"

      - name: Verify source and native engine
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          bash scripts/build-wasm.sh
          corepack pnpm --filter @mathrl/site typecheck
          corepack pnpm --filter @mathrl/site test

      - name: Run Wasm browser tests with a matching WebDriver
        env:
          # The wrapper first selects a local exact/same-build/same-major
          # driver; if none exists it resolves the exact operator-supplied
          # Chrome for Testing version and verifies its executable SHA-256
          # before invoking wasm-pack.  The capability file points the driver
          # at the same pinned Playwright Chromium binary.
          WASM_PACK_MODE: normal
          WASM_NO_DRIVER_DOWNLOAD: '0'
          WASM_CHROMEDRIVER_VERSION: ${{ inputs.wasm_chromedriver_version }}
          WASM_CHROMEDRIVER_SHA256: ${{ inputs.wasm_chromedriver_sha256 }}
        run: |
          set -o pipefail
          corepack pnpm wasm:test:browser 2>&1 | tee wasm-browser-test.log

      - name: Run bilingual parity preflight
        run: corepack pnpm content:check

      - name: Verify upstream source pin
        env:
          UPSTREAM_SYNC_REPORT: release-evidence/upstream-sync.json
        run: corepack pnpm upstream:check

      - name: Generate bilingual review packet
        env:
          REVIEW_PACKET_DIR: release-evidence
        run: corepack pnpm review:packet

      - name: Build production Pages artifact
        env:
          APP_VERSION: ${{ inputs.app_version }}
          SITE_BASE: ${{ inputs.site_base || steps.pages.outputs.base_path || '/' }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          VITE_SITE_STAGE: production
        run: |
          export RELEASE_GIT_SHA="$(git rev-parse HEAD)"
          export BUILD_TIMESTAMP="$(git show -s --format=%cI HEAD)"
          corepack pnpm build

      - name: Verify production metadata and artifact
        env:
          PAGES_BASE: ${{ inputs.site_base || steps.pages.outputs.base_path || '/' }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_STAGE: production
        run: |
          node scripts/check-pages-artifact.mjs
          node scripts/check-pwa-artifact.mjs
          node scripts/check-sbom.mjs
          SECURITY_AUDIT_STRICT=1 SECURITY_AUDIT_REPORT=release-evidence/security-audit.json node scripts/check-dependency-audit.mjs
          PERF_DIST=site/docs/.vitepress/dist node scripts/check-performance-budget.mjs --json > release-evidence/performance-report.json

      - name: Record immutable release context
        env:
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_APP_VERSION: ${{ inputs.app_version }}
          RELEASE_SITE_BASE: ${{ inputs.site_base || steps.pages.outputs.base_path || '/' }}
          RELEASE_PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          RELEASE_WASM_DRIVER_VERSION: ${{ inputs.wasm_chromedriver_version }}
          RELEASE_WASM_DRIVER_SHA256: ${{ inputs.wasm_chromedriver_sha256 }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module - <<'NODE'
          import { writeFile } from 'node:fs/promises'
          import { execFileSync } from 'node:child_process'
          const context = {
            schemaVersion: 1,
            requestedRef: process.env.RELEASE_REF,
            checkedOutCommit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            appVersion: process.env.RELEASE_APP_VERSION,
            siteBase: process.env.RELEASE_SITE_BASE,
            pagesOrigin: process.env.RELEASE_PAGES_ORIGIN || null,
            wasmChromeDriverVersion: process.env.RELEASE_WASM_DRIVER_VERSION,
            wasmChromeDriverSha256: process.env.RELEASE_WASM_DRIVER_SHA256,
            wasmChromeBinary: process.env.CHROME_BIN || null,
            workflowRunId: process.env.RELEASE_RUN_ID,
            workflowRunUrl: process.env.RELEASE_RUN_URL,
            recordedAt: new Date().toISOString(),
          }
          if (context.requestedRef !== context.checkedOutCommit) throw new Error('release context SHA mismatch')
          if (!context.workflowRunUrl || !/^https?:\/\//.test(context.workflowRunUrl)) {
            throw new Error('release context workflow URL is missing or invalid')
          }
          await writeFile('release-evidence/release-context.json', `${JSON.stringify(context, null, 2)}\n`)
          NODE

      - name: Run all-browser release E2E and accessibility checks
        env:
          PLAYWRIGHT_BROWSERS: all
          PLAYWRIGHT_MOBILE: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/playwright-results.json
          SITE_BASE: ${{ inputs.site_base || steps.pages.outputs.base_path || '/' }}
          VITE_SITE_STAGE: production
        run: corepack pnpm --filter @mathrl/site exec playwright test --reporter=list,json

      - name: Enforce production content and rights gate
        env:
          RELEASE: '1'
          RELEASE_REPORT: release-evidence/release-readiness.json
        run: node scripts/check-release-readiness.mjs --strict

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: mathrl-production-evidence-${{ github.run_id }}
          # A production run is not auditable when one of its machine or
          # review evidence files is absent.  Keep this fail-closed: a
          # partially completed job may still upload the files it produced,
          # but the action must make the missing record visible as a failure.
          if-no-files-found: error
          retention-days: 90
          path: |
            site/docs/.vitepress/dist/version.json
            site/docs/.vitepress/dist/release-manifest.json
            site/docs/.vitepress/dist/offline-manifest.json
            site/docs/.vitepress/dist/sbom.cdx.json
            site/docs/.vitepress/dist/licenses.json
            release-evidence/release-readiness.json
            release-evidence/security-audit.json
            release-evidence/performance-report.json
            release-evidence/release-context.json
            release-evidence/upstream-sync.json
            release-evidence/review-packet.json
            release-evidence/review-packet.md
            release-evidence/review-packet.csv
            wasm-browser-test.log
            playwright-results.json

      # Traces are useful when a browser check fails, but they are optional on
      # a clean run.  Keep them out of the required evidence set so an empty
      # success directory cannot make an otherwise valid release fail.
      - name: Upload browser traces (if any)
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: mathrl-production-browser-traces-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 90
          path: site/test-results/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/docs/.vitepress/dist
          # Keep the exact deployable archive available for the rollback
          # procedure; the action defaults to a one-day retention period.
          retention-days: 90

  deploy:
    name: Deploy production
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  smoke:
    name: Verify deployed production URL
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ needs.deploy.outputs.page_url }}

    steps:
      - name: Checkout released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Run HTTPS deployment smoke test
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.page_url }}
          SMOKE_REPORT: release-evidence/deployment-smoke.json
          EXPECTED_STAGE: production
          EXPECTED_APP_VERSION: ${{ inputs.app_version }}
          EXPECTED_GIT_SHA: ${{ inputs.ref }}
          SMOKE_RETRIES: '2'
          SMOKE_TIMEOUT_MS: '20000'
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          for attempt in 1 2 3 4 5 6; do
            if node scripts/smoke-deployed.mjs; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep "$((attempt * 10))"
            fi
          done
          echo "::error::production deployment smoke did not pass after Pages propagation retries"
          exit 1

      - name: Upload deployment smoke evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: mathrl-production-smoke-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: release-evidence/deployment-smoke.json
