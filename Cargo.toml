[workspace]
members = ["crates/mathrl-core", "crates/mathrl-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Independent original bilingual interactive textbook for reinforcement-learning foundations"
repository = "https://github.com/KraHsu/mathrl_visual"

[workspace.dependencies]
console_error_panic_hook = "0.1.7"
mathrl-core = { path = "crates/mathrl-core" }
rand = { version = "0.9.2", default-features = false, features = ["std"] }
rand_chacha = { version = "0.9.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.127"
wasm-bindgen-test = "0.3.77"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
